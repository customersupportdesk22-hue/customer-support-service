<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Console — Customer Support Service</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root{--primary:#003D82;--primary-dark:#002A5C;--accent:#F2B705;--success:#2F855A;
        --danger:#C53030;--cloud:#F0F4F8;--text:#1A2B4A;--muted:#5A6B85;--sidebar:#0F1C33}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,system-ui,sans-serif;display:flex;height:100vh;background:var(--sidebar);color:#fff}

  #sidebar{width:320px;background:var(--sidebar);display:flex;flex-direction:column;border-right:1px solid #1E3A6B}
  .sidebar-brand{padding:16px 18px;border-bottom:1px solid #1E3A6B}
  .sidebar-brand svg{height:40px;width:auto}
  .sidebar-head{padding:14px 18px 8px;font-size:12px;text-transform:uppercase;
                letter-spacing:1.5px;color:#7B8FAF;font-weight:600;display:flex;justify-content:space-between}
  #list{flex:1;overflow-y:auto;padding:0 12px 12px}
  .item{padding:12px 14px;border-radius:10px;background:#152549;margin-bottom:6px;cursor:pointer;
        font-size:14px;display:flex;flex-direction:column;gap:4px;border-left:3px solid transparent}
  .item:hover{background:#1E3A6B}
  .item.active{background:var(--primary);border-left-color:var(--accent)}
  .item .row{display:flex;justify-content:space-between;align-items:center;gap:6px}
  .item .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .item .topic{font-size:11.5px;color:#9AA9C4}
  .item .badge{font-size:10px;padding:3px 7px;border-radius:999px;background:var(--success);font-weight:600}
  .item .badge.wait{background:#7B8FAF}
  .item .badge.offline{background:#4A5878}
  .item .wa-badge{background:#25D366;font-size:10px;padding:3px 7px;border-radius:999px;font-weight:600;margin-left:4px;color:#fff}
  .logout{margin:12px;padding:10px;background:#1E3A6B;border:none;color:#fff;border-radius:8px;
          font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
  .logout:hover{background:#C53030}

  #main{flex:1;display:flex;flex-direction:column;background:var(--cloud);color:var(--text)}
  .topbar{background:#fff;padding:16px 24px;border-bottom:1px solid #E2E8F0;display:flex;
          justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .topbar .who{font-weight:600;font-size:15px}
  .topbar .who span{color:var(--muted);font-weight:400;margin-left:8px;font-size:13px}
  .topbar button{background:var(--primary);color:#fff;border:none;padding:8px 14px;border-radius:8px;
                 cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;margin-left:6px}
  .topbar button.danger{background:var(--danger)}
  .topbar button.wa{background:#25D366}
  .conn-status{margin-left:10px;font-size:11.5px;color:var(--muted)}

  #chat{flex:1;overflow-y:auto;padding:24px}
  .msg{padding:10px 14px;border-radius:14px;margin-bottom:8px;max-width:65%;font-size:14px;
       line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
  .me{background:var(--primary);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
  .them{background:#fff;border:1px solid #E2E8F0;border-bottom-left-radius:4px}
  .sys{background:#FFF7E0;color:#7A5C00;font-size:12.5px;border-left:3px solid var(--accent);max-width:100%}

  .typing{font-size:12px;color:var(--muted);font-style:italic;padding:4px 6px;height:18px}

  .composer{padding:16px 24px;background:#fff;border-top:1px solid #E2E8F0;display:flex;gap:8px}
  .composer input{flex:1;padding:12px 14px;border:1px solid #CBD5E0;border-radius:10px;font-size:14px;font-family:inherit}
  .composer button{background:var(--primary);color:#fff;border:none;padding:12px 24px;border-radius:10px;
                   font-weight:600;cursor:pointer;font-family:inherit}
  .empty{padding:40px;text-align:center;color:var(--muted);font-size:14px}

  @media (max-width: 720px){
    body{flex-direction:column;height:auto;min-height:100vh}
    #sidebar{width:100%;max-height:40vh}
    #main{min-height:60vh}
  }
</style>
</head>
<body>

<div id="sidebar">
  <div class="sidebar-brand">
    <svg viewBox="0 0 340 72" xmlns="http://www.w3.org/2000/svg">
      <rect x="8" y="8" width="56" height="56" rx="14" fill="#fff"/>
      <path d="M22 34v-6a14 14 0 0 1 28 0v6" stroke="#F2B705" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      <rect x="18" y="32" width="8" height="14" rx="3" fill="#F2B705"/>
      <rect x="38" y="32" width="8" height="14" rx="3" fill="#F2B705"/>
      <path d="M46 44v4a4 4 0 0 1-4 4h-6" stroke="#F2B705" stroke-width="3" stroke-linecap="round" fill="none"/>
      <text x="80" y="40" font-family="Inter,sans-serif" font-size="22" font-weight="700" fill="#fff">Customer Support</text>
      <text x="81" y="58" font-family="Inter,sans-serif" font-size="13" font-weight="600" fill="#F2B705" letter-spacing="2">AGENT CONSOLE</text>
    </svg>
  </div>
  <div class="sidebar-head">
    <span>Conversations</span><span id="count">0</span>
  </div>
  <div id="list"></div>
  <button class="logout" onclick="logout()">Log out</button>
</div>

<div id="main">
  <div class="topbar">
    <div class="who" id="title">Select a conversation <span>— nothing selected</span></div>
    <div>
      <span class="conn-status" id="connStatus"></span>
      <button class="wa" onclick="inviteWhatsApp()">💬 Invite to WhatsApp</button>
      <button class="danger" onclick="endChat()">End chat</button>
    </div>
  </div>
  <div id="chat"><div class="empty">No conversation selected. Pick a customer from the left.</div></div>
  <div class="typing" id="typingIndicator"></div>
  <div class="composer">
    <input id="msg" placeholder="Reply to this customer… (type /wa to invite to WhatsApp)" onkeydown="if(event.key==='Enter')send()">
    <button onclick="send()">Send</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io({
  reconnection: true,
  reconnectionAttempts: Infinity,
  reconnectionDelay: 500,
  reconnectionDelayMax: 3000,
  timeout: 20000,
  transports: ['websocket', 'polling']
});

let activeRoom = null;
let customers = [];
const inputEl = document.getElementById('msg');

socket.on('connect', () => {
  document.getElementById('connStatus').textContent = '🟢 Online';
  socket.emit('agent:register');
  if (activeRoom) socket.emit('agent:join', { roomId: activeRoom });
});

socket.on('disconnect', () => {
  document.getElementById('connStatus').textContent = '🔴 Reconnecting…';
});

socket.on('customer:list', (list) => { customers = list; refresh(); });
socket.on('customer:new', (c) => {
  if (!customers.find(x => x.roomId === c.roomId)) customers.push(c);
  refresh();
});
socket.on('customer:update', () => refresh());

function refresh(){
  document.getElementById('count').textContent = customers.length;
  const el = document.getElementById('list');
  el.innerHTML = '';
  customers.forEach(c => {
    const d = document.createElement('div');
    d.className = 'item' + (activeRoom === c.roomId ? ' active' : '');
    const waBadge = c.waInvited ? '<span class="wa-badge">WA</span>' : '';

    let status = 'WAITING';
    let badgeClass = 'wait';
    if (!c.customerId) { status = 'OFFLINE'; badgeClass = 'offline'; }
    else if (c.agentId) { status = 'LIVE'; badgeClass = ''; }

    d.innerHTML = `<div class="row">
                     <span class="name">${escapeHtml(c.name)}</span>
                     ${waBadge}
                     <span class="badge ${badgeClass}">${status}</span>
                   </div>
                   <div class="topic">${escapeHtml(c.topic || 'General')}</div>`;
    d.onclick = () => openChat(c);
    el.appendChild(d);
  });
}

function escapeHtml(s){return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function openChat(c){
  activeRoom = c.roomId;
  socket.emit('agent:join', { roomId: c.roomId });
  document.getElementById('title').innerHTML =
    escapeHtml(c.name) + ' <span>— ' + escapeHtml(c.topic || 'General') + '</span>';
  document.getElementById('chat').innerHTML = '';
  document.getElementById('typingIndicator').textContent = '';
  refresh();
}

socket.on('chat:history', ({ messages }) => {
  const chat = document.getElementById('chat');
  chat.innerHTML = '';
  (messages || []).forEach(m => renderMsg(m));
});

socket.on('chat:message', (m) => {
  renderMsg(m);
  document.getElementById('typingIndicator').textContent = '';
});

function renderMsg(m){
  const chat = document.getElementById('chat');
  if (chat.querySelector('.empty')) chat.innerHTML = '';
  const d = document.createElement('div');
  if (m.structured){
    d.className = 'msg sys';
    d.textContent = '📋 ' + m.structured.type + ' — ' + JSON.stringify(m.structured.payload);
  } else {
    d.className = 'msg ' + (m.from === 'customer' ? 'them' : 'me');
    d.textContent = m.text;
  }
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

let typingTimer = null;
if (inputEl) {
  inputEl.addEventListener('input', () => {
    if (!activeRoom) return;
    socket.emit('typing', { roomId: activeRoom, from: 'agent' });
    clearTimeout(typingTimer);
    typingTimer = setTimeout(() => {
      socket.emit('typing:stop', { roomId: activeRoom, from: 'agent' });
    }, 1500);
  });
}

socket.on('typing', ({ from }) => {
  if (from === 'customer') {
    document.getElementById('typingIndicator').textContent = 'Customer is typing…';
  }
});
socket.on('typing:stop', ({ from }) => {
  if (from === 'customer') {
    document.getElementById('typingIndicator').textContent = '';
  }
});

function send(){
  const text = inputEl.value.trim();
  if(!text || !activeRoom) return;

  if (/^\/wa$/i.test(text)) {
    socket.emit('wa:invite', { roomId: activeRoom });
    inputEl.value = '';
    return;
  }

  socket.emit('chat:message', { roomId: activeRoom, text, from: 'agent' });
  socket.emit('typing:stop', { roomId: activeRoom, from: 'agent' });
  inputEl.value = '';
}

function inviteWhatsApp(){
  if(!activeRoom) return;
  socket.emit('wa:invite', { roomId: activeRoom });
}

function endChat(){
  if(!activeRoom) return;
  if(!confirm('End this chat for the customer?')) return;
  socket.emit('chat:end', { roomId: activeRoom });
  customers = customers.filter(c => c.roomId !== activeRoom);
  activeRoom = null;
  document.getElementById('chat').innerHTML = '<div class="empty">No conversation selected. Pick a customer from the left.</div>';
  document.getElementById('title').innerHTML = 'Select a conversation <span>— nothing selected</span>';
  document.getElementById('typingIndicator').textContent = '';
  refresh();
}

async function logout(){
  await fetch('/api/logout', { method: 'POST' });
  window.location.href = '/login.html';
}
</script>
</body>
</html>
